# Serves the built frontend and hands /api/ to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /api/metrics -> http://api:8000/metrics (the trailing slash strips the prefix).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # Built assets are content-hashed, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/metrics, /timeline, ...) all load the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
